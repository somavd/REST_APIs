<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard — Online Compiler</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .dashboard {
            min-height: 100vh;
            padding: 40px 20px;
            background: #0b1120;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 32px;
        }
        .dashboard-header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto 32px;
        }
        .dashboard-grid .card {
            text-align: center;
        }
        .dashboard-grid .card h3 {
            margin-bottom: 12px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .dashboard-grid .card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #2563eb;
        }
        .dashboard-actions {
            display: flex;
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .dashboard-actions button {
            flex: 1;
            min-width: 200px;
        }
        .profile-text {
            color: #94a3b8;
            margin: 0;
        }
        .nav { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; max-width: 900px; margin-left: auto; margin-right: auto; }
        .nav a { color: #3b82f6; text-decoration: none; font-size: 0.95rem; }
        .nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>Student Dashboard</h1>
                <p class="profile-text" id="profileText">Loading...</p>
            </div>
            <button class="danger" onclick="logout()">Logout</button>
        </div>


        <div class="dashboard-grid">
            <div class="card">
                <h3>Total Submissions</h3>
                <div class="value" id="totalSubmissions">0</div>
            </div>
            <div class="card">
                <h3>Questions Attempted</h3>
                <div class="value" id="questionsAttempted">0</div>
            </div>
            <div class="card">
                <h3>Account</h3>
                <div class="value" id="accountStatus" style="font-size: 1rem; color: #4ade80; margin-top: 12px;">Active</div>
            </div>
        </div>

        <div class="dashboard-actions">
            <button class="primary" onclick="location.href='/public/student-questions.html'">Solve Questions</button>
            <button class="primary" onclick="location.href='/public/student-submissions.html'">View Submissions</button>
        </div>

        <div id="status" class="status" role="status" aria-live="polite" style="max-width: 900px; margin: 24px auto 0;"></div>
    </div>

    <script src="student-dashboard.js"></script>
</body>
</html>
