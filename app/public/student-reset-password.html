<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Online Compiler</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <h1>Reset Password</h1>
            <p class="description">Enter the reset code from your email and choose a new password.</p>
            <form id="resetForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required autofocus>
                </div>
                <div class="form-group">
                    <label for="otp">Reset Code</label>
                    <input type="text" id="otp" placeholder="6-digit code" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="8-32 characters" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
                </div>
                <button type="submit" class="primary">Reset Password</button>
                <p style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
                    <a href="student-login.html">Back to Login</a>
                </p>
                <div id="status" class="status" role="status" aria-live="polite"></div>
            </form>
        </div>
    </main>
    <script src="student-reset-password.js"></script>
</body>
</html>
