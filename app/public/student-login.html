<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — Online Compiler</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .tabs { display: flex; border-bottom: 1px solid #334155; margin-bottom: 24px; }
        .tab { flex: 1; padding: 12px; background: none; border: none; color: #94a3b8; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-extras { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 16px; font-size: 0.85rem; color: #94a3b8; }
        .form-extras a { color: #3b82f6; text-decoration: none; }
        .form-extras a:hover { text-decoration: underline; }
        .form-extras label { display: flex; align-items: center; gap: 6px; }
        .form-extras input[type="checkbox"] { width: auto; margin: 0; }
        .switch-text { text-align: center; margin-top: 16px; color: #94a3b8; font-size: 0.9rem; }
        .switch-text a { color: #3b82f6; cursor: pointer; }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <h1>Coding Platform</h1>
            <p class="description">Practice coding challenges. Log in or create an account.</p>

            <div class="tabs">
                <button class="tab active" data-tab="login">Login</button>
                <button class="tab" data-tab="register">Register</button>
            </div>

            <div id="loginTab" class="tab-content active">
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="loginEmail">Username or Email</label>
                        <input type="text" id="loginEmail" placeholder="Enter username or email" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <div class="form-extras">
                        <label><input type="checkbox" id="rememberMe"> Remember me</label>
                        <a href="student-forgot-password.html">Forgot password?</a>
                    </div>
                    <button type="submit" class="primary">Sign In</button>
                </form>
            </div>

            <div id="registerTab" class="tab-content">
                <form id="registerForm" class="login-form">
                    <div class="form-group">
                        <label for="registerName">Full Name</label>
                        <input type="text" id="registerName" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Username or Email</label>
                        <input type="text" id="registerEmail" placeholder="Choose a username or email" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="registerConfirmPassword">Confirm Password</label>
                        <input type="password" id="registerConfirmPassword" placeholder="Re-enter password" required>
                    </div>
                    <button type="submit" class="primary">Register</button>
                </form>
            </div>

            <div class="switch-text" id="switchText">
                Don't have an account? <a id="switchLink" data-switch="register">Register</a>
            </div>

            <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
    </main>

    <script src="student-login.js"></script>
</body>
</html>
