<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Online Compiler</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <h1>Forgot Password</h1>
            <p class="description">Enter your email and we'll send a reset code.</p>
            <form id="forgotForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required autofocus>
                </div>
                <button type="submit" class="primary">Send Reset Code</button>
                <p style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
                    <a href="student-login.html">Back to Login</a>
                </p>
                <div id="status" class="status" role="status" aria-live="polite"></div>
            </form>
        </div>
    </main>
    <script src="student-forgot-password.js"></script>
</body>
</html>
