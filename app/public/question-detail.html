<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Question Details | Online Compiler</title>

<link rel="stylesheet" href="/public/admin.css">
</head>

<body>

<div class="container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Compiler Admin</h2>

        <ul>
            <li><a href="/public/admin-dashboard.html">Dashboard</a></li>
            <li class="active"><a href="/public/admin-questions.html">Questions</a></li>
            <li><a href="#" onclick="logout(); return false;">Logout</a></li>
        </ul>
    </aside>

    <div class="content">
        <button onclick="location.href='/public/admin-questions.html'" class="primary">← Back to Questions</button>
        <button onclick="const qid = new URLSearchParams(location.search).get('id'); if (qid) location.href = '/public/add-question.html?id=' + qid;" class="primary" style="margin-left: 10px;">Edit Question</button>

        <div id="status" class="status"></div>

        <div class="card question-card">
            <h1 id="questionTitle">Question Title</h1>
            <p id="questionDescription" class="question-description">Description</p>

            <div class="question-meta">
                <p><strong>Category:</strong> <span id="questionCategory"></span></p>
                <p><strong>Difficulty:</strong> <span id="questionDifficulty"></span></p>
            </div>
        </div>

        <h2>Test Cases</h2>
        <table>
            <thead>
                <tr>
                    <th>Sr No</th>
                    <th>Input</th>
                    <th>Expected Output</th>
                    <th>Visibility</th>
                </tr>
            </thead>
            <tbody id="testcaseTable"></tbody>
        </table>
    </div>
</div>

<script src="/public/shared.js"></script>
<script src="/public/question-detail.js"></script>

</body>
</html>
